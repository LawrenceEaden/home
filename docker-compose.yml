# audiobook server
  audiobookshelf:
    container_name: audiobookshelf    
    image: ghcr.io/advplyr/audiobookshelf:latest
    network_mode: "service:tailscale" #VPN
    #ports:
    #  - 13378:80
    volumes:
      - /mnt/sdb1/media/audiobooks:/audiobooks
      - /mnt/sdb1/media/podcasts:/podcasts
      - /var/config/audiobookshelf:/config
      - /var/config/audiobookshelf/metadata:/metadata
    healthcheck:
      test: curl -fsS http://localhost:80 || exit 1
      start_period: 60s
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
         tailscale:
           condition: service_healthy
