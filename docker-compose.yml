version: '1.0'
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 #qbittorrent
      - 7878:7878 #radarr
      - 8989:8989 #sonarr
      - 9696:9696 #prowlarr
    volumes:
      - /mnt/sda1/docker/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=AG5xsGonNI2IONzxZ+Un447vDkirtO2HZTrEdFjMe2c=
      - WIREGUARD_ADDRESSES=10.69.207.110/32
      - SERVER_CITIES=London
      - TZ=etc/UTC
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/sda1/docker/qbittorrent/config:/config
      - /mnt/sda1/downloads:/downloads
    network_mode: "service:gluetun"

    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    volumes:
      - /mnt/sda1/docker/plex/library:/config
      - /mnt/sda1/tv:/tv
      - /mnt/sda1/movies:/movies
    ports:
      - 32400:32400
    restart: unless-stopped
    
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/sda1/docker/radarr:/config
      - /mnt/sda1/movies:/movies #optional
      - /mnt/sda1/downloads:/downloads #optional
    network_mode: "service:gluetun"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/sda1/docker/sonarr:/config
      - /mnt/sda1/tv:/tv #optional
      - /mnt/sda1/downloads:/downloads #optional
    network_mode: "service:gluetun"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/data:/config
    network_mode: "service:gluetun"
    restart: unless-stopped
