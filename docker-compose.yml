version: '2.1'
services:
   
# torrent client
  qbittorrent:
    image: linuxserver/qbittorrent:latest   
    network_mode: host
    container_name: qbittorrent
    ports:
      - 8080:8080
      - 6881:6881
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /var/config/qbittorrent:/config
      - /mnt/data/downloads:/data/downloads
      - /var/config/scripts:/scripts
      - /tmp/torrents:/tmp
    restart: unless-stopped

# movie collection manager
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest 
    network_mode: host
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/radarr:/config
      - /mnt/data:/data
      - /var/config/scripts:/scripts
    restart: unless-stopped

# tv collection manager
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest 
    network_mode: host
    ports:
      - 8989:8989    
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/sonarr:/config
      - /mnt/data:/data
      - /var/config/scripts:/scripts
    restart: unless-stopped

# audiobooks collection manager
  readarr:
    container_name: readarr
    image: linuxserver/readarr:nightly   
    network_mode: host
    ports:
      - 8787:8787
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/readarr:/config
      - /mnt/data:/data
      - /var/config/scripts:/scripts
    restart: unless-stopped

#indexer manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: host
    ports:
      - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/prowlarr:/config
      - /var/config/scripts:/scripts
    restart: unless-stopped

# indexer proxy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: host
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
    volumes:
      - /var/config/scripts:/scripts
    restart: unless-stopped

# audiobook server
  audiobookshelf:
    container_name: audiobookshelf    
    image: ghcr.io/advplyr/audiobookshelf:latest
    network_mode: host
    ports:
      - 80:80
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/data/media/audiobooks:/audiobooks
      - /mnt/data/media/podcasts:/podcasts
      - /var/config/audiobookshelf:/config
      - /var/config/audiobookshelf/metadata:/metadata
      - /var/config/scripts:/scripts

# IPTV tuner for Plex
  threadfin:
    container_name: threadfin
    image: fyb3roptik/threadfin:latest
    network_mode: host
    ports:
      - 34400:34400  
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=etc/utc
    volumes:
      - /var/config/threadfin/conf:/home/threadfin/conf
      - /var/tmp/threadfin:/tmp/threadfin
      - /var/config/scripts:/scripts
    restart: unless-stopped

# local file sharing
  samba:
    container_name: samba
    image: docker.io/servercontainers/samba:latest 
    cap_add:
      - CAP_NET_ADMIN
    network_mode: host
    environment:
      ACCOUNT_Lawrence: spicysamba1234
      UID_Lawrence: 1000
      SAMBA_VOLUME_CONFIG_config: |
        [shares]
         path = /shares
         guest ok = yes
         browseable = yes
         available = yes
         writable = yes
         public = yes
         read only = no
         create mask = 666
         directory mask = 777
    volumes:
        - /mnt/data:/shares

