version: '2.1'
services:

# VPN
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /var/config/gluetun:/config
    environment:
      - VPNSP=mullvad
      - VPN_TYPE=openvpn
      - OPENVPN_USER=4379779465932262
      - OPENVPN_CIPHERS=AES-256-GCM
      - OWNED=yes
      - SERVER_COUNTRIES=UK
      - TZ=Europe/London
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    restart: always
    labels:
      - autoheal=true
      
# reverse proxy
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: "service:gluetun" #VPN
    environment:
      - TS_AUTHKEY=tskey-client-kLvpKstMQV11CNTRL-MPaCiyoSBkJwyjL4Ebc8kJ3zc2p1YeuaW?ephemeral=false
      - TS_AUTH_ONCE=true
      - TS_ACCEPT_DNS=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=plexpi
      - TS_ROUTES=192.168.1.0/24
      - TS_EXTRA_ARGS=--advertise-tags=tag:container --accept-routes --advertise-exit-node
      - TS_Socket=/var/run/tailscale/tailscaled.sock tailscale/tailscale
#      - TS_NO_LOGS_NO_SUPPORT=true
    volumes:
      - /var/config/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
      - sys_module
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "tailscale status"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      - autoheal=true
      
# local file sharing
  samba:
    container_name: samba
    image: docker.io/servercontainers/samba:latest 
    cap_add:
      - CAP_NET_ADMIN
    network_mode: "service:tailscale"
    environment:
      ACCOUNT_Lawrence: spicysamba1234
      UID_Lawrence: 1000
      SAMBA_VOLUME_CONFIG_config: |
        [shares]
         path = /shares
         guest ok = yes
         browseable = yes
         available = yes
         writable = yes
         public = yes
         read only = no
         create mask = 666
         directory mask = 777
    volumes:
      - /var/config:/shares/config
      - /mnt/sdb1/media:/shares/media
    depends_on:
      tailscale:
        condition: service_healthy
    labels:
      - autoheal=true
      
# media server
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    network_mode: "service:tailscale" #VPN    
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=etc/utc
    volumes:
      - /var/config/jellyfin:/config
      - /mnt/sdb1/media/movies:/movies
      - /mnt/sdb1/media/tv:/tv
      - /mnt/sdb1/media/dvr:/dvr
      - /var/config/threadfin/conf/data:/xml #XMLTV from Xteve
    healthcheck:
          test: curl -fsS curl -i http://localhost:8096/health || exit 1
#          start_period: 180s
          timeout: 5s
          interval: 5s
          retries: 60
    depends_on:
      tailscale:
        condition: service_healthy
    labels:
      - autoheal=true
            
# torrent client
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    network_mode: "service:tailscale" #VPN   
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /var/config/qbittorrent:/config
      - /mnt/sdb1/downloads:/sdb1/downloads
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:8080 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      jellyfin:
        condition: service_healthy
    labels:
      - autoheal=true

# movie collection manager
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    network_mode: "service:tailscale" #VPN  
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/radarr:/config
      - /mnt/sdb1:/sdb1 
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:7878 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      qbittorrent:
        condition: service_healthy
    labels:
      - autoheal=true

# tv collection manager
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    network_mode: "service:tailscale" #VPN  
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/sonarr:/config
      - /mnt/sdb1:/sdb1
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:8989 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      radarr:
        condition: service_healthy
    labels:
      - autoheal=true

# audiobooks collection manager
  readarr:
    container_name: readarr
    image: linuxserver/readarr:nightly 
    network_mode: "service:tailscale" #VPN   
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/readarr:/config
      - /mnt/sdb1:/sdb1
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:8787 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      sonarr:
        condition: service_healthy
    labels:
      - autoheal=true

#indexer manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:tailscale" #VPN  
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/prowlarr:/config
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:9696 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      readarr:
        condition: service_healthy
    labels:
      - autoheal=true

# indexer proxy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:tailscale" #VPN  
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:8191 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      prowlarr:
        condition: service_healthy
    labels:
      - autoheal=true

# audiobook server
  audiobookshelf:
    container_name: audiobookshelf    
    image: ghcr.io/advplyr/audiobookshelf:latest
    network_mode: "service:tailscale" #VPN  
    #ports:
    #  - 13378:80
    volumes:
      - /mnt/sdb1/media/audiobooks:/audiobooks
      - /mnt/sdb1/media/podcasts:/podcasts
      - /var/config/audiobookshelf:/config
      - /var/config/audiobookshelf/metadata:/metadata
    healthcheck:
      test: curl -fsS http://localhost:80 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      flaresolverr:
        condition: service_healthy
    labels:
      - autoheal=true

# IPTV tuner for Plex
  threadfin:
    container_name: threadfin
    image: fyb3roptik/threadfin:latest
    network_mode: "service:tailscale" #VPN   
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=etc/utc
    volumes:
      - /var/config/threadfin/conf:/home/threadfin/conf
      - /var/tmp/threadfin:/tmp/threadfin
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://localhost:34400/web || exit 1
      start_period: 420s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      audiobookshelf:
        condition: service_healthy
    labels:
      - autoheal=true

# home automation
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:latest
    network_mode: "service:tailscale" #VPN  
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /mnt/sdb1/media/:/media
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: curl -fsS http://127.0.0.1:8123 || exit 1
#      start_period: 120s
      timeout: 5s
      interval: 5s
      retries: 60
    depends_on:
      audiobookshelf:
        condition: service_healthy
    labels:
      - autoheal=true


# auto restart containers
  autoheal:
    container_name: autoheal
#    deploy:
#      replicas: 1
    image: willfarrell/autoheal:latest
    network_mode: none
#    environment:
#      - AUTOHEAL_START_PERIOD=120
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
