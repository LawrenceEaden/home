version: '1.1'
services:

# media server
  plex:
    container_name: plex
    image: linuxserver/plex:latest
    network_mode: host
    ports:
      - 32400:32400
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    volumes:
      - /var/config/plex:/config
      - /mnt/sdb1/media/tv:/tv
      - /mnt/sdb1/media/movies:/movies
      - /mnt/sdb1/media/audiobooks:/audiobooks
      - /var/config/threadfin/conf/data:/xml #XMLTV from Xteve
    restart: unless-stopped
    healthcheck:
      test: curl -fsS http://127.0.0.1:32400/identity > /dev/null || exit 1
      start_period: 60s
      timeout: 10s
      interval: 5s
      retries: 3

# VPN
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # qbittorrent webUI
      - 6881:6881/tcp # qbittorrent torrent port tcp
      - 6881:6881/udp # qbittorrent torrent port udp
      - 7878:7878 # radarr
      - 8989:8989 # sonarr
      - 8787:8787 # readarr
      - 9696:9696 # prowlarr
      - 34400:34400/tcp # xteve
      - 8191:8191 #flaresolverr
    volumes:
      - /var/config/gluetun:/config
    environment:
      - VPNSP=mullvad
      - VPN_TYPE=openvpn
      - OPENVPN_USER=4379779465932262
      - OPENVPN_CIPHERS=AES-256-GCM
      - OWNED=yes
      - SERVER_COUNTRIES=UK
      - TZ=Europe/London
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    restart: unless-stopped
    
# torrent client
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    network_mode: "service:gluetun" #VPN
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /var/config/qbittorrent:/config
      - /mnt/sdb1/downloads:/sdb1/downloads
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:8080 || exit 1
      start_period: 90s
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

# movie collection manager
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/radarr:/config
      - /mnt/sdb1:/sdb1
    network_mode: "service:gluetun"
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:7878 || exit 1
      start_period: 60s
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

# tv collection manager
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/sonarr:/config
      - /mnt/sdb1:/sdb1
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:8989 || exit 1
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

# audiobooks collection manager
  readarr:
    container_name: readarr
    image: linuxserver/readarr:nightly 
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/readarr:/config
      - /mnt/sdb1:/sdb1
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:8787 || exit 1
      start_period: 90s
      timeout: 20s
      interval: 20s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

#indexer manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/prowlarr:/config
    network_mode: "service:gluetun"
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:9696 || exit 1
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

# indexer proxy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    network_mode: "service:gluetun"
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:8191 || exit 1
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

# IPTV tuner for Plex
  threadfin:
    container_name: threadfin
    image: fyb3roptik/threadfin:latest
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=etc/utc
    volumes:
      - /var/config/threadfin/conf:/home/threadfin/conf
      - /var/tmp/threadfin:/tmp/threadfin
    restart: unless-stopped
    healthcheck:
      test: curl -fSs http://127.0.0.1:34400/web || exit 1
      start_period: 420s
      timeout: 10s
      interval: 60s
      retries: 3
    depends_on:
      gluetun:
        condition: service_healthy

# local file sharing
  samba:
    container_name: samba
    image: docker.io/servercontainers/samba:latest 
    cap_add:
      - CAP_NET_ADMIN
    network_mode: host
    ports:
      - 445:445
    environment:
      ACCOUNT_username: password
      UID_username: 1000
      SAMBA_VOLUME_CONFIG_config: |
        [shares]
         path = /shares
         guest ok = yes
         browseable = yes
         available = yes
         writable = yes
         public = yes
         force user = username
    volumes:
      - /var/config:/shares/config
      - /mnt/sdb1:/shares/sdb1
    restart: always

# home automation
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:latest
    network_mode: host
    ports:
      - 8123:8123
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      #- /var/config/homeassistant:/config
      - /var/config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: curl -fsS http://127.0.0.1:8123 || exit 1
      start_period: 60s
      timeout: 10s
      interval: 5s
      retries: 3
      
# audiobook server
  audiobookshelf:
    container_name: audiobookshelf    
    image: ghcr.io/advplyr/audiobookshelf:latest
    network_mode: bridge
    ports:
      - 13378:80
    volumes:
      - /mnt/sdb1/media/audiobooks:/audiobooks
      - /mnt/sdb1/media/podcasts:/podcasts
      - /var/config/audiobookshelf:/config
      - /var/config/audiobookshelf/metadata:/metadata
    healthcheck:
      test: curl -fsS http://127.0.0.1:80 || exit 1
      start_period: 60s
      timeout: 10s
      interval: 5s
      retries: 3

# dddns updater
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    network_mode: host 
    environment:
      - PUID=1000 
      - PGID=1000 
      - TZ=Etc/UTC 
      - SUBDOMAINS=eaden,lozflix
      - TOKEN=05ac446b-de08-4d2e-89f1-4c0c85cdd59b
      - UPDATE_IP=ipv4 
      - LOG_FILE=true
    volumes:
      - /var/config/duckdns:/config 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s4 https://icanhazip.com | grep -qF $(nslookup eaden.duckdns.org 8.8.8.8 | awk '/^Address: /{print $2}')"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
