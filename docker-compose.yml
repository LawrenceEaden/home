
services:

#VPN - AirVPN
gluetun:
  image: qmcgaw/gluetun
  container_name: gluetun
  cap_add:
    - NET_ADMIN
  ports:
    - "8080:8080" # qbittorrent WebUI
    - "${TORRENT_PORT}:${TORRENT_PORT}" # qbittorrent torrent
    - "${TORRENT_PORT}:${TORRENT_PORT}/udp" # qbittorrent torrent
  volumes:
    - /var/config/gluetun:/gluetun
  environment:
    - VPN_SERVICE_PROVIDER=airvpn
    - VPN_TYPE=wireguard
    - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
    - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
    - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
    - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
    - WIREGUARD_PERSISTENT_KEEPALIVE=15
    - SERVER_COUNTRIES=United Kingdom
    - FIREWALL_VPN_INPUT_PORTS=${TORRENT_PORT}
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped

   
# torrent client
  qbittorrent:
    image: linuxserver/qbittorrent:latest   
    network_mode: service:gluetun
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${TORRENT_PORT}
    volumes:
      - /var/config/qbittorrent:/config
      - /mnt/data/downloads:/data/downloads
      - /var/config/scripts:/scripts
      - /tmp/torrents:/tmp
    restart: unless-stopped

# movie collection manager
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest 
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/radarr:/config
      - /mnt/data:/data
      - /var/config/scripts:/scripts
    restart: unless-stopped

# tv collection manager
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest 
    ports:
      - 8989:8989    
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/sonarr:/config
      - /mnt/data:/data
      - /var/config/scripts:/scripts
    restart: unless-stopped

# subtitles manager
  bazarr:
      image: lscr.io/linuxserver/bazarr:latest
      container_name: bazarr
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Etc/UTC
      volumes:
        - /path/to/bazarr/config:/config
        - /mnt/data:/data
      ports:
        - 6767:6767
      restart: unless-stopped

#indexer manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /var/config/prowlarr:/config
      - /var/config/scripts:/scripts
    restart: unless-stopped

# indexer proxy
  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: flaresolverr
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
    volumes:
      - /var/config/scripts:/scripts
    restart: unless-stopped

# local file sharing
  samba:
    container_name: samba
    image: docker.io/servercontainers/samba:latest 
    cap_add:
      - CAP_NET_ADMIN
    network_mode: host
    environment:
      ACCOUNT_username: password
      UID_username: 1000
      SAMBA_VOLUME_CONFIG_config: |
        [data]
         path = /data
         guest ok = no
         browseable = yes
         available = yes
         writable = yes
         public = no
         read only = no
         create mask = 666
         directory mask = 777

        [config]
         path = /config
         guest ok = no
         browseable = yes
         available = yes
         writable = yes
         public = no
         read only = no
         create mask = 666
         directory mask = 777        
    volumes:
        - /mnt/data:/data
        - /var/config:/config
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
